version: '3.8'

services:
  # MongoDB for metadata storage
  mongodb:
    image: mongo:7.0
    container_name: cloudvault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: cloudvault
    volumes:
      - mongo_data:/data/db

  # Redis for BullMQ queues, caching, and rate limiting
  redis:
    image: redis:7.2-alpine
    container_name: cloudvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # MinIO for S3-compatible private object storage
  minio:
    image: minio/minio:latest
    container_name: cloudvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - minio_data:/data

  # MinIO bucket creation initialization
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin miniopassword;
      /usr/bin/mc mb myminio/cloudvault-media || true;
      /usr/bin/mc anonymous set none myminio/cloudvault-media;
      exit 0;
      "

  # NestJS Node.js Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cloudvault-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/cloudvault?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret_jwt_access_key_cloudvault_2026
      REFRESH_TOKEN_SECRET: supersecret_jwt_refresh_key_cloudvault_2026
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: miniopassword
      S3_BUCKET: cloudvault-media
      PYTHON_SERVICE_URL: http://media-service:8000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - mongodb
      - redis
      - minio

  # Python Media & AI Worker Service
  media-service:
    build:
      context: ../media-service
      dockerfile: Dockerfile
    container_name: cloudvault-media-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: miniopassword
      S3_BUCKET: cloudvault-media
      PYTHONUNBUFFERED: 1
    depends_on:
      - redis
      - minio

volumes:
  mongo_data:
  redis_data:
  minio_data:
